<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="472" height="472" x="20" y="20" rx="80" fill="none" stroke="#1E293B" stroke-width="4"/>
  <!-- Central Server Nodes -->
  <g transform="translate(96, 96)">
    <!-- Server 1 -->
    <rect x="20" y="40" width="280" height="60" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="4"/>
    <circle cx="55" cy="70" r="8" fill="#10B981"/>
    <circle cx="80" cy="70" r="8" fill="#06B6D4"/>
    <line x1="120" y1="70" x2="260" y2="70" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Server 2 -->
    <rect x="20" y="130" width="280" height="60" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="4"/>
    <circle cx="55" cy="160" r="8" fill="#10B981"/>
    <circle cx="80" cy="160" r="8" fill="#06B6D4"/>
    <line x1="120" y1="160" x2="260" y2="160" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Server 3 -->
    <rect x="20" y="220" width="280" height="60" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="4"/>
    <circle cx="55" cy="250" r="8" fill="#10B981"/>
    <circle cx="80" cy="250" r="8" fill="#F59E0B"/>
    <line x1="120" y1="250" x2="260" y2="250" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Network Circuit lines -->
    <path d="M 160 280 L 160 310 L 80 310 L 80 330" fill="none" stroke="#06B6D4" stroke-width="4"/>
    <path d="M 160 280 L 160 310 L 240 310 L 240 330" fill="none" stroke="#06B6D4" stroke-width="4"/>
    <circle cx="80" cy="335" r="7" fill="#06B6D4"/>
    <circle cx="240" cy="335" r="7" fill="#06B6D4"/>
  </g>
</svg>
